name: build
on: [push, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Что за Visual Studio на раннере
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -all -products * -format value -property displayName,installationVersion }
          else { "vswhere не найден" }
          cmake --version

      - name: Распаковать архив
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath . -Force
          if (-not (Test-Path CMakeLists.txt)) {
            $d = Get-ChildItem -Directory | Where-Object {
              Test-Path (Join-Path $_.FullName 'CMakeLists.txt') } | Select-Object -First 1
            Get-ChildItem -Path $d.FullName -Force | Move-Item -Destination . -Force
          }

      - run: cmake -B build
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: HUSK-windows
          path: |
            build/HUSK_artefacts/Release/VST3/**
            build/HUSK_artefacts/Release/Standalone/**
